<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600;700&family=Great+Vibes&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F4E8C1; --blue:#0B2545; --blue-2:#134074; --blue-dark:#021124;
  --gold:#D4AF37; --gold-dark:#B38F1D; --bg:#FFFDF9; --text:#1C2541; --muted:#5C677D;
  --shadow:0 15px 35px rgba(11,37,69,.08); --ease:all .4s cubic-bezier(.25,1,.5,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Montserrat','Noto Sans Kannada','Noto Sans Telugu','Noto Sans Tamil',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
html[lang=kn] :is(body,h1,h2,h3,h4,button,input,select,textarea){font-family:'Noto Sans Kannada',sans-serif}
html[lang=te] :is(body,h1,h2,h3,h4,button,input,select,textarea){font-family:'Noto Sans Telugu',sans-serif}
html[lang=ta] :is(body,h1,h2,h3,h4,button,input,select,textarea){font-family:'Noto Sans Tamil',sans-serif}
html[lang=hi] :is(body,h1,h2,h3,h4,button,input,select,textarea){font-family:'Noto Sans Devanagari',sans-serif}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}

/* Floating controls */
.fab{position:fixed;z-index:10001;border:none;cursor:pointer;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.25);transition:var(--ease)}
.fab:hover{transform:scale(1.08)}
#lang-select{top:16px;right:16px;padding:10px 14px;border-radius:30px;font-weight:600;font-size:.85rem;background:rgba(2,17,36,.85);border:1px solid var(--gold);appearance:auto}
#lang-select option{color:#000;background:#fff}
#audio-toggle{bottom:25px;right:25px;width:52px;height:52px;border-radius:50%;font-size:1.3rem;display:none;justify-content:center;align-items:center;background:linear-gradient(135deg,var(--gold),var(--gold-dark))}

/* Petals */
#flower-layer{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.petal{position:absolute;top:0;opacity:0;animation:fall linear infinite}
@keyframes fall{0%{transform:translateY(-10%) rotate(0);opacity:0}10%,90%{opacity:.85}100%{transform:translateY(110vh) translateX(120px) rotate(450deg);opacity:0}}

/* Splash */
#splash{position:fixed;inset:0;height:100dvh;background:linear-gradient(135deg,var(--blue),var(--blue-dark));display:flex;justify-content:center;align-items:center;z-index:10000;overflow:hidden;transition:transform 1.2s cubic-bezier(.76,0,.24,1)}
#splash.opened{transform:translateY(-100%);pointer-events:none}
#splash::before{content:'';position:absolute;width:200%;height:200%;background:repeating-linear-gradient(45deg,rgba(212,175,55,.04) 0 2px,transparent 2px 20px);animation:pattern 25s linear infinite}
@keyframes pattern{to{transform:translate(-100px,-100px)}}
.splash-inner{position:relative;width:92%;max-width:650px;padding:30px 20px;text-align:center;color:#fff}
.splash-greet{font-family:'Great Vibes',cursive;font-size:2.2rem;color:var(--gold);min-height:2.8rem;margin-bottom:6px}
.splash-title{font-family:'Cinzel',serif;font-size:1.8rem;letter-spacing:5px;text-transform:uppercase;margin-bottom:16px;opacity:0;animation:fadeBlur 1.2s .3s forwards}
.splash-sub{font-weight:300;font-size:1.05rem;letter-spacing:2px;line-height:1.7;color:var(--cream);margin-bottom:40px;opacity:0;animation:fadeBlur 1.2s .7s forwards}
.open-btn{background:transparent;border:2px solid var(--gold);color:#fff;padding:16px 42px;font-size:.95rem;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;border-radius:50px;opacity:0;animation:fadeUp 1s 1.2s forwards;transition:var(--ease)}
.open-btn:hover{color:var(--blue);background:#fff;border-color:#fff;box-shadow:0 0 30px rgba(255,255,255,.6)}

/* Language chooser */
.language-screen{position:fixed;inset:0;z-index:20000;display:flex;align-items:center;justify-content:center;overflow-y:auto;padding:24px 16px;background:linear-gradient(135deg,var(--blue),var(--blue-dark))}
.language-screen.hidden{display:none}
.language-panel{width:min(100%,500px);margin:auto;padding:36px 28px;text-align:center;background:rgba(255,255,255,.97);border:1px solid rgba(212,175,55,.45);border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.28)}
.language-panel h1{font-family:'Cinzel',serif;font-size:1.8rem;color:var(--blue);margin-bottom:10px}
.language-panel p{color:var(--muted);line-height:1.6;margin-bottom:24px}
.language-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.language-btn{min-height:52px;padding:12px 14px;border:1px solid rgba(212,175,55,.5);border-radius:10px;background:#fff;color:var(--blue);font-size:1rem;font-weight:600;cursor:pointer;transition:var(--ease)}
.language-btn:hover{background:var(--blue);color:#fff;transform:translateY(-2px);box-shadow:0 6px 18px rgba(11,37,69,.2)}

/* Cover */
.cover{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;color:#fff;padding:60px 20px 40px;
  background:linear-gradient(to bottom,rgba(0,0,0,.2),rgba(0,0,0,.4) 60%,rgba(0,0,0,.75) 90%,var(--bg)),url('images/ma.jpg') center/cover no-repeat var(--blue)}
.cover-text{margin:auto 0}
.cover-names{font-family:'Cinzel',serif;font-size:3.5rem;font-weight:700;letter-spacing:2px;text-shadow:2px 4px 15px rgba(0,0,0,.8)}
.cover-names span{display:block}
.cover-names .amp{font-family:'Great Vibes',cursive;font-size:4rem;color:var(--gold);margin:-10px 0}
.cover-date{display:inline-block;margin-top:15px;padding-bottom:8px;font-weight:600;font-size:1.15rem;letter-spacing:6px;text-transform:uppercase;border-bottom:2px solid var(--gold);text-shadow:1px 2px 10px rgba(0,0,0,.6)}
.scroll-hint{display:flex;flex-direction:column;align-items:center;font-weight:600;font-size:.85rem;letter-spacing:2px;text-transform:uppercase;animation:bounce 2s infinite;text-shadow:1px 1px 5px rgba(0,0,0,.7)}
.scroll-hint b{font-size:1.4rem;margin-top:4px;color:var(--gold)}

/* Layout */
.container{max-width:850px;margin:0 auto;padding:40px 20px 80px;opacity:0;transform:translateY(40px);transition:all 1.2s cubic-bezier(.25,1,.5,1) .3s}
.container.visible{opacity:1;transform:none}
.card{background:rgba(255,255,255,.98);border-radius:16px;box-shadow:var(--shadow);border:1px solid rgba(212,175,55,.15)}
.hero{padding:50px 30px;text-align:center;margin-bottom:40px}
.invite-text{max-width:680px;margin:0 auto 30px;font-size:1.05rem;line-height:1.85;font-weight:500}
.hero-carousel{width:min(100%,560px);aspect-ratio:4/3;margin:25px auto 0;perspective:1000px}
.hero-carousel img{width:100%;height:100%;object-fit:contain;background:rgba(11,37,69,.04);border-radius:12px;box-shadow:0 4px 15px rgba(0,0,0,.06);transform-origin:center}
.hero-carousel img.flip-in{animation:photoFlip .7s ease both}
@keyframes photoFlip{from{opacity:0;transform:rotateY(-75deg) scale(.96)}to{opacity:1;transform:rotateY(0) scale(1)}}
.count-note{margin-top:35px;font-size:.88rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--blue)}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:30px}

/* Countdown */
.countdown{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-top:25px}
.unit{display:flex;flex-direction:column;align-items:center;gap:8px}
.unit-label{font-size:.68rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);font-weight:600}
.flip{position:relative;width:76px;height:86px;perspective:300px}
.flip>div{display:flex;justify-content:center;width:100%;height:50%;overflow:hidden;background:linear-gradient(160deg,#0f2d52,var(--blue-dark));border:1px solid rgba(212,175,55,.25)}
.flip span{font-family:'Cinzel',serif;font-size:2.2rem;font-weight:700;color:var(--gold);line-height:86px;text-shadow:0 2px 8px rgba(0,0,0,.4)}
.f-top{border-radius:8px 8px 0 0}
.f-bot{border-radius:0 0 8px 8px;box-shadow:0 8px 20px rgba(2,17,36,.4)}
.f-bot span,.f-back-bot span{margin-top:-43px}
.f-back-top,.f-back-bot{position:absolute!important;left:0;backface-visibility:hidden}
.f-back-top{top:0;border-radius:8px 8px 0 0;transform-origin:bottom}
.f-back-bot{top:50%;border-radius:0 0 8px 8px;transform-origin:top;transform:rotateX(90deg)}
.flip.go .f-back-top{animation:flipTop .28s ease-in forwards}
.flip.go .f-back-bot{animation:flipBot .28s ease-out .28s forwards}
@keyframes flipTop{to{transform:rotateX(-90deg)}}
@keyframes flipBot{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.today{font-family:'Cinzel',serif;font-size:1.6rem;color:var(--blue);margin-top:25px}
.today small{display:block;font-family:'Montserrat',sans-serif;font-size:.95rem;color:var(--muted);margin:8px 0 18px}

/* Tabs */
.tabs{display:flex;position:sticky;top:20px;z-index:100;margin-bottom:35px;padding:6px;border-radius:50px;background:rgba(255,255,255,.95);box-shadow:var(--shadow);border:1px solid rgba(212,175,55,.25);backdrop-filter:blur(10px)}
.tab{flex:1;padding:14px 8px;background:none;border:none;border-radius:40px;font-size:.85rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:var(--ease)}
.tab:hover{color:var(--blue);background:rgba(244,232,193,.35)}
.tab.active{color:#fff;background:linear-gradient(135deg,var(--blue),var(--blue-2));box-shadow:0 4px 15px rgba(11,37,69,.25)}
.panel{display:none;padding:50px 40px;animation:panelIn .5s ease forwards}
.panel.active{display:block}
.panel-title{font-family:'Cinzel',serif;font-size:1.7rem;color:var(--blue);text-align:center;margin-bottom:35px;letter-spacing:2px}
.panel-title::after{content:'❦';display:block;color:var(--gold);font-size:1.2rem;margin-top:6px}

/* Schedule */
.timeline{max-width:600px;margin:0 auto;padding-left:35px;border-left:2px solid rgba(212,175,55,.35);position:relative}
.t-dot{position:absolute;left:-8px;top:4px;width:14px;height:14px;border-radius:50%;background:var(--gold);border:3px solid #fff;box-shadow:0 0 0 2px var(--gold)}
.t-time{font-size:.88rem;font-weight:700;color:var(--gold-dark);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.t-title{font-family:'Cinzel',serif;font-size:1.25rem;color:var(--blue);margin-bottom:10px}
.t-desc{font-size:.95rem;color:var(--muted);line-height:1.75}
.info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;max-width:650px;margin:35px auto 0}
.info{padding:18px;border-radius:12px;background:rgba(244,232,193,.28);border:1px solid rgba(212,175,55,.25)}
.info h5{font-size:.85rem;letter-spacing:1px;color:var(--blue);margin-bottom:6px}
.info p{font-size:.9rem;line-height:1.65;color:var(--muted)}

/* Venue */
.venue{text-align:center;max-width:600px;margin:0 auto}
.venue img{max-width:220px;margin:0 auto 20px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.08)}
.venue-name{font-family:'Cinzel',serif;font-size:1.45rem;color:var(--blue);margin-bottom:16px;line-height:1.4}
.venue-note{color:var(--muted);line-height:1.75;font-size:.95rem;margin-bottom:24px}
.contacts{margin-top:35px;padding-top:25px;border-top:1px solid rgba(212,175,55,.3)}
.contacts h4{font-family:'Cinzel',serif;color:var(--blue);margin-bottom:16px}
.contact{margin-bottom:18px}
.contact b{display:block;margin-bottom:8px;color:var(--text)}

/* Buttons */
.btn{display:inline-block;padding:14px 32px;border:none;border-radius:50px;cursor:pointer;color:#fff;text-decoration:none;font-size:.82rem;font-weight:600;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,var(--blue),var(--blue-dark));box-shadow:0 4px 15px rgba(11,37,69,.2);transition:var(--ease)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(11,37,69,.35)}
.btn:disabled{cursor:not-allowed;opacity:.65;transform:none;box-shadow:none}
.btn.alt{background:transparent;color:var(--blue);border:2px solid var(--gold);box-shadow:none}
.btn.alt:hover{background:var(--cream)}
.btn.wa{background:linear-gradient(135deg,#25a244,#128c3a)}
.btn.sm{padding:10px 22px;font-size:.75rem;margin:0 4px 6px}

/* Gallery */
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.g-item{aspect-ratio:1;border-radius:10px;overflow:hidden;border:2px solid rgba(212,175,55,.2);cursor:zoom-in;padding:0;background:rgba(11,37,69,.04)}
.g-item img{width:100%;height:100%;object-fit:contain;transition:transform .5s}
.g-item:hover img{transform:scale(1.08)}
.lightbox{position:fixed;inset:0;z-index:50000;display:flex;align-items:center;justify-content:center;background:rgba(2,6,18,.94);backdrop-filter:blur(14px);opacity:0;pointer-events:none;transition:opacity .4s}
.lightbox.active{opacity:1;pointer-events:auto}
.lb-inner{position:relative;max-width:90vw;max-height:85vh;display:flex;flex-direction:column;align-items:center}
.lb-inner img{max-width:90vw;max-height:75vh;object-fit:contain;border-radius:10px;border:2px solid rgba(212,175,55,.3);box-shadow:0 10px 35px rgba(0,0,0,.6)}
.lb-caption{margin-top:14px;color:#fff;font-family:'Cinzel',serif;letter-spacing:2px;font-size:1.1rem}
.lb-close{position:absolute;top:-45px;right:0;background:none;border:none;color:#fff;font-size:2.2rem;cursor:pointer;line-height:1}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;cursor:pointer;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:1.5rem;transition:var(--ease)}
.lb-nav:hover{background:var(--gold);color:var(--blue-dark)}
.lb-prev{left:-65px}.lb-next{right:-65px}

/* RSVP */
.rsvp-sub{text-align:center;margin:-15px auto 30px;color:var(--muted);line-height:1.6}
.form{max-width:520px;margin:0 auto}
.field{margin-bottom:22px}
.field>label,.field>legend{display:block;margin-bottom:8px;font-weight:600;font-size:.88rem;text-transform:uppercase;letter-spacing:1px;color:var(--blue)}
fieldset{border:none}
.input{width:100%;padding:14px 16px;border:1px solid rgba(92,103,125,.25);border-radius:10px;background:#fff;color:var(--text);font:inherit;transition:var(--ease)}
.input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15)}
textarea.input{resize:vertical;min-height:120px}
.choices{display:flex;gap:12px}
.choice{flex:1;position:relative}
.choice input{position:absolute;opacity:0;inset:0;cursor:pointer}
.choice span{display:block;padding:14px 10px;text-align:center;border:1px solid rgba(92,103,125,.25);border-radius:10px;font-weight:600;font-size:.9rem;color:var(--muted);transition:var(--ease)}
.choice input:checked+span{background:linear-gradient(135deg,var(--blue),var(--blue-2));color:#fff;border-color:var(--blue)}
.choice input:focus-visible+span{outline:3px solid var(--gold);outline-offset:2px}
.count{text-align:right;margin-top:6px;font-size:.78rem;color:var(--muted)}
.center{text-align:center;margin-top:30px}
.success{display:none;text-align:center;padding:40px 20px;animation:bloom .7s cubic-bezier(.34,1.56,.64,1) forwards}
.ring{width:80px;height:80px;margin:0 auto 20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2.2rem;border:2px solid var(--gold);color:var(--gold);background:linear-gradient(135deg,var(--blue),var(--blue-2))}
.success h4{font-family:'Cinzel',serif;font-size:1.6rem;color:var(--blue);letter-spacing:1.5px}
.success .name{font-family:'Great Vibes',cursive;font-size:2.2rem;color:var(--gold);margin:12px 0}
.success p{max-width:500px;margin:0 auto 24px;line-height:1.8;color:var(--muted)}
.success .sign{font-size:.85rem;letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);font-weight:600}
.footer-share{text-align:center;padding:10px 0 30px;color:var(--muted);font-size:.85rem}

@keyframes fadeBlur{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes bounce{0%,20%,50%,80%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}60%{transform:translateY(-5px)}}
@keyframes panelIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:none}}
@keyframes bloom{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}

@media(max-width:768px){.lb-prev{left:10px}.lb-next{right:10px}.lb-close{top:-40px;right:10px}.lb-caption{max-width:80vw;text-align:center}}
@media(min-width:601px) and (max-width:900px){
  .container{padding:32px 18px 64px}
  .hero{padding:42px 24px}
  .panel{padding:40px 28px}
  .gallery{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
}
@media(max-width:600px){
  .language-panel{padding:30px 20px}
  .language-panel h1{font-size:1.55rem}
  .language-options{grid-template-columns:1fr;gap:9px}
  .language-btn{min-height:46px}
  .splash-inner{padding:24px 16px}
  .splash-title{font-size:1.35rem;letter-spacing:2px}.splash-sub{font-size:.88rem;margin-bottom:28px}
  .cover{padding:44px 16px 28px}
  .cover-names{font-size:2.5rem}.cover-names .amp{font-size:3rem}.cover-date{max-width:100%;font-size:.9rem;letter-spacing:2px;line-height:1.5}
  .container{padding:24px 12px 48px}
  .card{border-radius:12px}
  .hero{padding:28px 16px}.invite-text{font-size:.95rem;line-height:1.75}
  .panel{padding:30px 18px}.panel-title{font-size:1.4rem;letter-spacing:1px}
  .tabs{top:8px;margin-bottom:24px;padding:4px;gap:2px;border-radius:14px}
  .tab{min-width:0;padding:11px 3px;font-size:.68rem;line-height:1.35;letter-spacing:0;overflow-wrap:anywhere}
  .count-note{font-size:.78rem;line-height:1.6;letter-spacing:1px;overflow-wrap:anywhere}
  .countdown{gap:8px}.unit{gap:6px}.unit-label{letter-spacing:1px}
  .flip{width:65px;height:75px}.flip span{font-size:1.8rem;line-height:75px}.f-bot span,.f-back-bot span{margin-top:-37px}
  .actions{gap:8px}.actions .btn{flex:1 1 135px;padding:12px 10px;font-size:.72rem;line-height:1.4;letter-spacing:1px}
  .timeline{padding-left:24px}.t-desc{font-size:.9rem}
  .info-grid{grid-template-columns:1fr;gap:12px;margin-top:24px}
  .choices{gap:8px}.choice span{padding:12px 8px;font-size:.82rem}
  .gallery{grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:12px}
  .lb-nav{width:40px;height:40px}
}
@media(max-width:360px){
  #lang-select{top:10px;right:10px;padding:8px 10px;font-size:.78rem}
  .cover-names{font-size:2.2rem}.cover-names .amp{font-size:2.6rem}
  .countdown{gap:6px}.flip{width:58px;height:70px}.flip span{font-size:1.6rem;line-height:70px}.f-bot span,.f-back-bot span{margin-top:-35px}
  .tab{font-size:.63rem}
}
@media(max-height:540px){
  .cover{padding-top:28px;padding-bottom:20px}
  .cover-names{font-size:2.2rem}.cover-names .amp{font-size:2.6rem}
  .splash-inner{padding-top:18px;padding-bottom:18px}
  .splash-sub{margin-bottom:20px}
  .language-screen{align-items:flex-start}
  .language-panel{padding-top:22px;padding-bottom:22px}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<section class="language-screen hidden" id="language-screen" role="dialog" aria-modal="true" aria-labelledby="language-title">
  <div class="language-panel">
    <h1 id="language-title">Welcome</h1>
    <p>Which is your mother tongue?</p>
    <div class="language-options">

  ta: {

    today: 'இன்றே அந்த நல்ல நாள்!', todaySub: 'விழாவிற்கு வாருங்கள். வர இயலாத உறவினர்கள் நேரலையில் காணலாம்.', live: 'நேரலையில் காண',
    addGoogle: 'கூகுள் காலெண்டரில் சேர்க்க',
    tabSchedule: 'நிகழ்ச்சி', tabVenue: 'இடம்', tabGallery: 'படங்கள்', tabRsvp: 'பதில்',
    scheduleTitle: 'நிகழ்ச்சி விவரம்', onwards: 'முதல்',
    eventTitle: 'பெயர் சூட்டு விழா & குடும்ப சந்திப்பு',
    eventDesc: 'மகிழ்ச்சியும் நன்றியும் நிறைந்த மனதுடன், எங்கள் செல்லக் குழந்தையின் வருகையைக் கொண்டாட உங்களை அழைக்கிறோம். ஆசீர்வாதம், சிரிப்பு, இனிய புகைப்படங்கள், கூட்டு உணவு, உறவினர்கள் நண்பர்களின் அன்புடன் பெற்றோராக எங்கள் இந்த அழகான அத்தியாயத்தைத் தொடங்குவோம்.',
    venueTitle: 'இடம்', venueName: 'ஸ்ரீ ஸ்வர்ண கௌரி கல்யாண மண்டபம், மடலு',
    maps: 'கூகுள் மேப்ஸ் திறக்க',
    galleryTitle: 'எங்கள் நினைவுகள்', rsvpTitle: 'எங்களுடன் கொண்டாடுங்கள்', rsvpSub: 'எங்கள் குழந்தைக்கான உங்கள் வாழ்த்துகளையும் ஆசியையும் எழுதுங்கள்.',
    fName: 'உங்கள் பெயர்', fWishes: 'வாழ்த்துகள் & ஆசிகள் (விருப்பம்)', send: 'பதில் அனுப்பு', sending: 'அனுப்புகிறது...',
    thanksH: 'பதில் கிடைத்தது', thanksP: 'உங்கள் அன்புக்கும் வாழ்த்துகளுக்கும் நன்றி. எங்கள் குழந்தையை ஆசீர்வதிக்க எங்கள் விழாவில் நீங்கள் பங்கேற்பது எங்களுக்குப் பெருமை.',
    error: 'உங்கள் பதிலை அனுப்ப முடியவில்லை. மீண்டும் முயற்சிக்கவும்.',
    after: 'எங்களுடன் கொண்டாடி எங்கள் குழந்தையை ஆசீர்வதித்ததற்கு நன்றி. உங்கள் அன்பு எங்களுக்கு மிகவும் மதிப்புமிக்கது.',
  }
};

const LOCALES = { en: 'en-GB', kn: 'kn-IN', hi: 'hi-IN', te: 'te-IN', ta: 'ta-IN' };
const NAMES = { en: ['Chaitra', 'Chethan'], kn: ['ಚೈತ್ರ', 'ಚೇತನ್'], hi: ['चैत्रा', 'चेतन'], te: ['చైత్ర', 'చేతన్'], ta: ['சைத்ரா', 'சேதன்'] };

/* =====================  HELPERS  ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const pageUrl = location.href.split('?')[0].split('#')[0];
const guestName = (new URLSearchParams(location.search).get('guest') || '').trim().slice(0, 40);
const emailReady = Object.values(EMAILJS).every(v => v && !v.startsWith('YOUR_')) && typeof emailjs !== 'undefined';
if (emailReady) emailjs.init({ publicKey: EMAILJS.publicKey });

const pickLang = code => (code || '').slice(0, 2).toLowerCase() in TEXT ? code.slice(0, 2).toLowerCase() : null;
let lang = pickLang(new URLSearchParams(location.search).get('lang')) || pickLang(localStorage.getItem('lang')) || pickLang(navigator.language) || 'en';
const t = key => TEXT[lang][key];

/* =====================  LANGUAGE + DATES  ===================== */
function formatDate() {
  const locale = LOCALES[lang];
  const zone = { timeZone: 'Asia/Kolkata' };
  return {
    date: EVENT_DATE.toLocaleDateString(locale, { day: 'numeric', month: 'long', year: 'numeric', ...zone }),
    time: EVENT_DATE.toLocaleTimeString(lang === 'en' ? 'en-IN' : LOCALES[lang], { hour: 'numeric', minute: '2-digit', hour12: true, ...zone }).toUpperCase()
  };
}

function applyLanguage() {
  document.documentElement.lang = lang;
  $('lang-select').value = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

  const { date, time } = formatDate();
  $('cover-date').textContent = date;
  $('count-note').textContent = `${t('counting')} • ${date}, ${time}`;
  $('schedule-time').textContent = `${date} • ${time} ${t('onwards')}`;
  $('greeting').textContent = guestName ? `${t('dear')} ${guestName}` : '';
  $('thanks-note').textContent = isOver() ? t('after') : '';
  if (!$('rsvp-name').value || $('rsvp-name').dataset.auto) { $('rsvp-name').value = guestName; $('rsvp-name').dataset.auto = '1'; }

  document.querySelectorAll('.unit-label').forEach(el => { el.textContent = t(el.dataset.unit); });
  setNames();
}

$('lang-select').addEventListener('change', e => {
  lang = e.target.value;
  localStorage.setItem('lang', lang);
  applyLanguage();
});

const languageScreen = $('language-screen');
document.querySelectorAll('[data-select-language]').forEach(button => button.addEventListener('click', () => {
  lang = button.dataset.selectLanguage;
  localStorage.setItem('lang', lang);
  languageScreen.classList.add('hidden');
  applyLanguage();
}));
languageScreen.addEventListener('keydown', e => {
  if (e.key !== 'Tab') return;
  const buttons = [...languageScreen.querySelectorAll('button')];
  const first = buttons[0], last = buttons[buttons.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
if (!new URLSearchParams(location.search).has('lang') && !localStorage.getItem('lang')) {
  languageScreen.classList.remove('hidden');
  languageScreen.querySelector('button').focus();
}

/* Cover names swap */
let swapped = false;
function setNames() {
  const pair = [...NAMES[lang]];
  if (swapped) pair.reverse();
  $('name1').textContent = pair[0]; $('name2').textContent = pair[1];
}
setInterval(() => { swapped = !swapped; setNames(); }, 2000);

/* =====================  OPEN INVITATION  ===================== */
$('open-btn').addEventListener('click', () => {
  $('splash').classList.add('opened');
  const btn = $('audio-toggle'), audio = $('soundtrack');
  btn.style.display = 'flex';
  audio.play().then(() => btn.textContent = '🔊').catch(() => btn.textContent = '🔇');
  $('main-content').classList.add('visible');
  createFlowers();
});
$('audio-toggle').addEventListener('click', () => {
  const audio = $('soundtrack'), btn = $('audio-toggle');
  if (audio.paused) audio.play().then(() => btn.textContent = '🔊').catch(() => {});
  else { audio.pause(); btn.textContent = '🔇'; }
});

/* =====================  COUNTDOWN  ===================== */
const isOver = () => Date.now() > EVENT_DATE.getTime() + EVENT_ENDS_AFTER_HOURS * 36e5;
const UNITS = ['days', 'hours', 'mins', 'secs'];

$('countdown').innerHTML = UNITS.map(u => `
  <div class="unit">
    <div class="flip" id="flip-${u}">
      <div class="f-top"><span>00</span></div><div class="f-bot"><span>00</span></div>
      <div class="f-back-top"><span>00</span></div><div class="f-back-bot"><span>00</span></div>
    </div>
    <span class="unit-label" data-unit="${u}"></span>
  </div>`).join('');

const prev = {};
function setUnit(u, value) {
  if (prev[u] === value) return;
  prev[u] = value;
  const card = $('flip-' + u), s = pad(value);
  const [top, bot, bTop, bBot] = card.querySelectorAll('span');
  bTop.textContent = bBot.textContent = s;
  card.classList.remove('go'); void card.offsetWidth; card.classList.add('go');
  setTimeout(() => { top.textContent = bot.textContent = s; card.classList.remove('go'); }, 600);
}

function tick() {
  const diff = EVENT_DATE - Date.now();
  if (diff <= 0) {                       // event day: replace countdown with a message
    $('countdown').classList.add('hidden');
    $('count-note').classList.add('hidden');
    $('today-box').classList.toggle('hidden', isOver());
    return;
  }
  setUnit('days',  Math.floor(diff / 864e5));
  setUnit('hours', Math.floor(diff % 864e5 / 36e5));
  setUnit('mins',  Math.floor(diff % 36e5 / 6e4));
  setUnit('secs',  Math.floor(diff % 6e4 / 1e3));
}
if (LIVE_URL) { $('live-btn').href = LIVE_URL; $('live-btn').classList.remove('hidden'); }
tick(); setInterval(tick, 1000);

/* =====================  CALENDAR  ===================== */
const stamp = d => d.toISOString().replace(/[-:]|\.\d{3}/g, '');
const END_DATE = new Date(EVENT_DATE.getTime() + EVENT_HOURS * 36e5);
const EVENT_NAME = `${t('eventTitle')} - Chaitra & Chethan`;

$('gcal-btn').href = 'https://calendar.google.com/calendar/render?' + new URLSearchParams({
  action: 'TEMPLATE', text: EVENT_NAME, dates: `${stamp(EVENT_DATE)}/${stamp(END_DATE)}`,
  details: 'Naming Ceremony & Family Gathering. ' + pageUrl, location: LOCATION
});

/* =====================  TABS  ===================== */
document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
  document.querySelectorAll('.tab, .panel').forEach(el => el.classList.remove('active'));
  tab.classList.add('active');
  $(tab.dataset.tab).classList.add('active');
}));

/* =====================  GALLERY + LIGHTBOX  ===================== */
let heroImageIndex = 0;
const heroImage = $('hero-carousel-image');
setInterval(() => {
  heroImageIndex = (heroImageIndex + 1) % GALLERY.length;
  const photo = GALLERY[heroImageIndex];
  heroImage.classList.remove('flip-in');
  heroImage.src = photo.src;
  heroImage.alt = photo.caption;
  void heroImage.offsetWidth;
  heroImage.classList.add('flip-in');
}, 5000);

let lb = 0;
$('gallery-grid').innerHTML = GALLERY.map((g, i) =>
  `<button class="g-item" data-i="${i}" aria-label="Open photo ${i + 1}"><img src="${g.src}" alt="${g.caption}" loading="lazy"></button>`).join('');
function showLb() {
  const g = GALLERY[lb];
  $('lb-img').src = g.src; $('lb-img').alt = g.caption; $('lb-caption').textContent = g.caption;
}
const stepLb = d => { lb = (lb + d + GALLERY.length) % GALLERY.length; showLb(); };
const closeLb = () => $('lightbox').classList.remove('active');
$('gallery-grid').addEventListener('click', e => {
  const item = e.target.closest('.g-item');
  if (!item) return;
  lb = +item.dataset.i; showLb(); $('lightbox').classList.add('active');
});
$('lb-close').addEventListener('click', closeLb);
$('lb-prev').addEventListener('click', e => { e.stopPropagation(); stepLb(-1); });
$('lb-next').addEventListener('click', e => { e.stopPropagation(); stepLb(1); });
$('lightbox').addEventListener('click', e => { if (e.target === e.currentTarget) closeLb(); });
document.addEventListener('keydown', e => {
  if (!$('lightbox').classList.contains('active')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') stepLb(-1);
  if (e.key === 'ArrowRight') stepLb(1);
});

/* =====================  RSVP  ===================== */
$('rsvp-name').addEventListener('input', e => { delete e.target.dataset.auto; });
$('rsvp-wishes').addEventListener('input', e => { $('char-count').textContent = e.target.value.length; });

$('rsvp-form').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('rsvp-name').value.trim();
  if (!name) return;
  const btn = $('submit-btn');
  btn.disabled = true; btn.textContent = t('sending');
  try {
    if (emailReady) {
      await emailjs.send(EMAILJS.serviceId, EMAILJS.templateId, {
        guest_name: name,
        wishes: $('rsvp-wishes').value.trim() || '-',
        submitted_at: new Date().toLocaleString('en-IN')
      });
    } else {
      console.info('EmailJS keys are placeholders; RSVP was not emailed.');
    }
    $('success-name').textContent = `${t('dear')} ${name}`;
    $('rsvp-form').classList.add('hidden');
    $('rsvp-success').style.display = 'block';
  } catch (err) {
    console.error(err);
    alert(t('error'));
    btn.disabled = false; btn.textContent = t('send');
  }
});

/* =====================  PETALS  ===================== */
function createFlowers() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layer = $('flower-layer'), icons = ['🌸', '🌺', '🌼', '✿', '🌷'];
  for (let i = 0; i < 18; i++) {
    const el = document.createElement('span');
    el.className = 'petal';
    el.textContent = icons[Math.floor(Math.random() * icons.length)];
    Object.assign(el.style, {
      left: Math.random() * 100 + '%',
      fontSize: 1 + Math.random() * 1.4 + 'rem',
      animationDuration: 6 + Math.random() * 8 + 's',
      animationDelay: Math.random() * 10 + 's'
    });
    layer.appendChild(el);
  }
}

applyLanguage();
</script>
</body>
</html>
